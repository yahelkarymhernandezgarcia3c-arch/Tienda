<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abarrotes Don Ponce - Login Administrador</title>
    <link rel="stylesheet" href="estilos/styles.css">
  </head>
  <body>
    <div class="header">
      <div class="navbar">
        <div class="brand">
          <h1 class="titulo-tienda">Abarrotes Don Ponce</h1>
        </div>
        <div class="nav-links">
          <a href="index.html">Inicio</a>
        </div>
      </div>
    </div>

    <div class="form-container" style="max-width:400px;text-align:center">
      <h2>🔐 Acceso Administrador</h2>
      <p class="subtitle-form">Ingresa tus credenciales para administrar el inventario.</p>
      <form action="admin.html" method="get" style="text-align:left">
        <div class="campo-form">
          <label>Usuario:</label>
          <input type="text" placeholder="admin" required>
        </div>
        <div class="campo-form">
          <label>Contraseña:</label>
          <input type="password" placeholder="admin123" required>
        </div>
        <button type="submit" class="btn-enviar" style="background-color:#ff9900;color:black">Entrar al Sistema</button>
      </form>
      <div class="enlace-volver" style="margin-top:20px">
        <a href="index.html">← Regresar a la tienda</a>
      </div>
      <p class="subtitle-form">Acceso de demostración; no valida credenciales.</p>
    </div>

    <div class="footer">
      <p>&copy; 2026 Abarrotes Don Ponce S.A. de C.V. - Todos los derechos reservados.</p>
    </div>
  </body>
</html>
